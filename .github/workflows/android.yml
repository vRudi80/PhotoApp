name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build React Web App
        run: |
          cd frontend
          npx vite build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          cd frontend
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap copy android
          npx cap update android

      - name: Setup Keystore from Secret and Force Gradle Usage
        run: |
          mkdir -p frontend/android/app
          mkdir -p ~/.android
          cd frontend/android/app
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "--- Keystore betöltése a biztonságos GitHub Secret-ből ---"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "--- Új állandó Keystore generálása ---"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 🔑 KÉNYSZERÍTJÜK A GRADLE-T, HOGY EZT A KULCSOT HASZNÁLJA AZ APK ALÁÍRÁSÁHOZ:
          cp debug.keystore ~/.android/debug.keystore

          echo "=========================================="
          echo "=== A GRADLE ÁLTAL HASZNÁLT SHA-1: ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "=========================================="

      - name: Inject Google Server Client ID into Android Strings
        run: |
          STRINGS_FILE="frontend/android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i '/<\/resources>/i \    <string name="server_client_id">197361744572-ih728hq5jft3fqfd1esvktvrd8i97kcp.apps.googleusercontent.com<\/string>' "$STRINGS_FILE"
          fi

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotAwesome-Android-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
