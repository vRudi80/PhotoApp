name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build React Web App
        run: |
          cd frontend
          npx vite build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          cd frontend
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap copy android
          npx cap update android

      - name: Setup Fixed Keystore from Secret
        run: |
          mkdir -p frontend/android/app
          cd frontend/android/app
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "--- Állandó Keystore betöltése a GitHub Secret-ből ---"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "--- Új Keystore generálása ---"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Force Gradle to strictly use our Secret Keystore
        run: |
          GRADLE_FILE="frontend/android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/signingConfigs {/a \        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }' "$GRADLE_FILE"
          fi

      - name: Inject Google Client IDs into Android Strings
        run: |
          STRINGS_FILE="frontend/android/app/src/main/res/values/strings.xml"
          CLIENT_ID="197361744572-ih728hq5jft3fqfd1esvktvrd8i97kcp.apps.googleusercontent.com"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i "/server_client_id/d" "$STRINGS_FILE"
            sed -i "/default_web_client_id/d" "$STRINGS_FILE"
            sed -i "/<\/resources>/i \    <string name=\"server_client_id\">$CLIENT_ID<\/string>" "$STRINGS_FILE"
            sed -i "/<\/resources>/i \    <string name=\"default_web_client_id\">$CLIENT_ID<\/string>" "$STRINGS_FILE"
          fi

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify Final Permanent SHA-1 from APK
        run: |
          APK_PATH="frontend/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "============================================================"
          echo "=== AZ ÉLETBEN TÖBBÉ NEM VÁLTOZÓ ÁLLANDÓ SHA-1 KÓDOD: ==="
          keytool -printcert -jarfile "$APK_PATH" | grep "SHA1:"
          echo "============================================================"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotAwesome-Android-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
