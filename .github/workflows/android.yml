name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build React Web App
        run: |
          cd frontend
          npx vite build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create Fix Debug Keystore & Print SHA-1
        run: |
          mkdir -p frontend/android/app
          keytool -genkey -v -keystore frontend/android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          echo "=== SHA-1 FINGERPRINT BEGIN ==="
          keytool -list -v -keystore frontend/android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "=== SHA-1 FINGERPRINT END ==="

      - name: Initialize Capacitor Android
        run: |
          cd frontend
          npx cap add android || true
          npx cap copy android
          npx cap update android

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotAwesome-Android-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
