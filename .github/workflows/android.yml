name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build React Web App
        run: |
          cd frontend
          npx vite build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          cd frontend
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap copy android
          npx cap update android

      - name: Setup Keystore from Secret or Generate New
        run: |
          mkdir -p frontend/android/app
          cd frontend/android/app
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "--- Keystore betöltése a biztonságos GitHub Secret-ből ---"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
          else
            echo "--- Új állandó Keystore generálása ---"
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "=========================================================="
            echo "=== MÁSOLD KI AZ ALÁBBI BASE64 KÓDOT A GITHUB SECRET-BE: ==="
            base64 -w 0 debug.keystore
            echo ""
            echo "=========================================================="
          fi

          echo "=========================================="
          echo "=== A VÉGLEGES, ÖRÖK SHA-1 FINGERPRINT: ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "=========================================="

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotAwesome-Android-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
