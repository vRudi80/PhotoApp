name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build React Web App
        run: |
          cd frontend
          npx vite build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor Android
        run: |
          cd frontend
          npx cap add android || true
          npx @capacitor/assets generate --android || true
          npx cap copy android
          npx cap update android

      - name: Setup Keystore from Secret
        run: |
          mkdir -p frontend/android/app
          mkdir -p ~/.android
          cd frontend/android/app
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            cp debug.keystore ~/.android/debug.keystore
          fi

      - name: Inject Runtime Debug Popup into MainActivity
        run: |
          cat << 'EOF' > frontend/android/app/src/main/java/com/photawesome/app/MainActivity.java
          package com.photawesome.app;

          import android.os.Bundle;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.Signature;
          import com.getcapacitor.BridgeActivity;
          import java.security.MessageDigest;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      PackageInfo info = getPackageManager().getPackageInfo(
                          getPackageName(),
                          PackageManager.GET_SIGNATURES
                      );
                      for (Signature signature : info.signatures) {
                          MessageDigest md = MessageDigest.getInstance("SHA");
                          md.update(signature.toByteArray());
                          byte[] digest = md.digest();
                          StringBuilder hexString = new StringBuilder();
                          for (int i = 0; i < digest.length; i++) {
                              if (i > 0) hexString.append(":");
                              String hex = Integer.toHexString(0xFF & digest[i]);
                              if (hex.length() == 1) hexString.append("0");
                              hexString.append(hex.toUpperCase());
                          }
                          String sha1 = hexString.toString();
                          runOnUiThread(() -> {
                              new android.app.AlertDialog.Builder(this)
                                  .setTitle("🔍 A TELEFON ÁLTAL HASZNÁLT ADATOK")
                                  .setMessage("Csomagnév:\n" + getPackageName() + "\n\nTényleges SHA-1:\n" + sha1)
                                  .setPositiveButton("OK", null)
                                  .show();
                          });
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Inject Google Client IDs into Android Strings
        run: |
          STRINGS_FILE="frontend/android/app/src/main/res/values/strings.xml"
          CLIENT_ID="197361744572-ih728hq5jft3fqfd1esvktvrd8i97kcp.apps.googleusercontent.com"
          if [ -f "$STRINGS_FILE" ]; then
            sed -i "/server_client_id/d" "$STRINGS_FILE"
            sed -i "/default_web_client_id/d" "$STRINGS_FILE"
            sed -i "/<\/resources>/i \    <string name=\"server_client_id\">$CLIENT_ID<\/string>" "$STRINGS_FILE"
            sed -i "/<\/resources>/i \    <string name=\"default_web_client_id\">$CLIENT_ID<\/string>" "$STRINGS_FILE"
          fi

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotAwesome-Android-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
